<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베이비페어 럭키드로우</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap">

    <script>
        // 기본 데이터 (로직용) - '행운의 참가상' 포함
        // weight: 당첨 확률 가중치 (재고와 별개, 상대값). stock: 남은 재고(0이면 추첨 대상에서 자동 제외)
        const DEFAULT_ITEMS = [
            { id: 1, name: "튼튼영어 베이비리그", stock: 5, weight: 5 },
            { id: 2, name: "그레이트북스 세트", stock: 10, weight: 10 },
            { id: 3, name: "아람 전집", stock: 8, weight: 8 },
            { id: 4, name: "키즈에이원 세트", stock: 15, weight: 15 },
            { id: 5, name: "매직큐브 큐블로", stock: 20, weight: 20 },
            { id: 6, name: "동아제약 미니막스", stock: 50, weight: 50 },
            { id: 7, name: "행운의 참가상", stock: 9999, weight: 9999 }
        ];

        const WHEEL_DESIGN_COLORS = ["#DD3E78", "#FF6FA5", "#FFB6CE", "#FFE3ED", "#DD3E78", "#FF6FA5", "#FFB6CE", "#FFE3ED"];
        const SPIN_DURATION_OPTIONS = [0.3, 0.5, 0.7, 1, 2, 3];

        const STORAGE_KEY = "luckydraw_data_v1";

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.items)) return null;
                // 이전 버전 데이터에 weight가 없으면 stock 값으로 보정
                data.items = data.items.map(it => ({ ...it, weight: (typeof it.weight === 'number') ? it.weight : it.stock }));
                return data;
            } catch (e) {
                console.warn('저장된 데이터를 불러오지 못했습니다.', e);
                return null;
            }
        }

        function persist() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: window.items, spinDuration: window.spinDuration }));
        }

        const saved = loadFromStorage();
        window.items = saved ? saved.items : DEFAULT_ITEMS;
        window.spinDuration = (saved && typeof saved.spinDuration === 'number' && saved.spinDuration > 0) ? saved.spinDuration : 0.5;
        let isSpinning = false;
        let currentRotation = 0;
    </script>

    <style>

            --main-pink: #DD3E78;
            --pink-dark: #B72F5F;
            --pink-light: #FFE3ED;
            --bg-soft: #FFF6F9;
            --text-black: #111111;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;

        * { box-sizing: border-box; }

        body {

        #wheel-container {

        #wheel {

        .segment {

            width: 50%;
            height: 50%;

        .needle {

            height: 7vh;

        .center-cap {

            height: 17vh;

            height: 13.5vh;
            border-radius: 50%;

            align-items: center;
            justify-content: center;

            line-height: 1.2;

            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            cursor: pointer;
            border: none;
            word-break: keep-all;
            z-index: 160;
            font-family: inherit;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.08);
            filter: brightness(1.05);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bottom-info {
            z-index: 10;
        }

        .instruction-text {

        }

            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(0,0,0,0.15);
            background: rgba(0,0,0,0.03);

            height: 44px;

            align-items: center;
            justify-content: center;

            padding: 0;

        .admin-trigger svg { width: 22px; height: 22px; }

        /* 결과 오버레이 */
        .result-overlay {
             display: none;
             position: fixed;
             top: 0; left: 0; width: 100%; height: 100%;
             background: rgba(221, 62, 120, 0.98);
             z-index: 10000;
             flex-direction: column;

             align-items: center;
             text-align: center;
             padding: 20px;
             border: none;
             cursor: pointer;
        }
        .result-overlay.active { display: flex; animation: winShow 0.5s cubic-bezier(0.19, 1, 0.22, 1); }

        @keyframes winShow {
            from { opacity: 0; transform: scale(0.7); }

            0%, 100% { transform: translateY(-18%); }

        }
        .congrats-title {
            font-size: min(5vh, 60px);

            margin: 0 0 24px 0;

        .result-card {

            font-size: 20px;

        .prob-badge {

        }
    </style>

<body>

        </button>

        <div class="top-header">
            <h1>행운 가득! 럭키드로우 이벤트</h1>
            <p class="sub-info">인천베이비&키즈페어 사전등록자 한정 (1인 1회 참여)</p>

        <div id="wheel-container">

            <h3 class="modal-title-sm">관리자 인증</h3>
            <input type="password" id="admin-pass" class="pin-input" placeholder="PIN CODE">
            <button type="button" onclick="checkAdminPass()" class="btn-block btn-dark">확인</button>
            <button type="button" onclick="closeModal('admin-login-modal')" class="btn-link-muted">취소</button>
        </div>
    </div>

    <div id="admin-settings-modal" class="modal-overlay">
        <div class="modal-panel-lg">
            <div class="modal-header">
                <h3 class="modal-title-lg">운영 설정</h3>
                <button type="button" class="modal-close-btn" onclick="closeModal('admin-settings-modal')" aria-label="닫기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="settings-section">
                <label class="field-label">룰렛 회전 시간</label>
                <div id="duration-btn-list" class="duration-btn-list"></div>
            </div>
            <div class="info-banner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>확률(%)은 재고가 있는 상품끼리 "확률 가중치"를 상대 비교하여 자동 계산됩니다. 재고가 0이 되면 자동으로 추첨 대상에서 제외됩니다.</span>
            </div>
            <div id="admin-item-list" class="admin-item-list"></div>
            <button type="button" onclick="addItem()" class="btn-add-item">+ 경품 추가</button>
            <button type="button" onclick="saveData()" class="btn-save">저장 및 적용</button>
        </div>
    </div>

    <script>
        /*!
         * canvas-confetti v1.6.0 (MIT License) - https://github.com/catdad/canvas-confetti

    <script>
        function createClovers() {
            const container = document.getElementById('bg-clovers');
            const count = 15;
            for (let i = 0; i < count; i++) {
                const clover = document.createElement('span');
                clover.className = 'clover';
                clover.textContent = '💗';
                clover.style.left = Math.random() * 100 + 'vw';
                clover.style.fontSize = (Math.random() * 20 + 20) + 'px';
                clover.style.animationDelay = Math.random() * 15 + 's';
                clover.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(clover);
            }
        }
        createClovers();

        const wheel = document.getElementById('wheel');
        const segCount = 8;
        const step = 360 / segCount;
        WHEEL_DESIGN_COLORS.forEach((color, i) => {
            const seg = document.createElement('div');
            seg.className = 'segment';
            seg.style.backgroundColor = color;
            seg.style.transform = `rotate(${step * i}deg) skewY(${90 - step}deg)`;
            wheel.appendChild(seg);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (document.activeElement.tagName === 'INPUT') return;
                const overlay = document.getElementById('result-overlay');
                if (overlay.classList.contains('active')) {
                    closeResult();
                    e.preventDefault();
                    return;
                }
                if (!isSpinning && !document.querySelector('.modal-overlay.open')) {
                    spin();
                    e.preventDefault();
                }
            }
        });

        function getActiveItems() {
            return window.items.filter(it => it.stock > 0 && it.weight > 0);
        }

        function renderDurationButtons() {
            const list = document.getElementById('duration-btn-list');
            list.innerHTML = SPIN_DURATION_OPTIONS.map(sec => `
                <div class="duration-btn ${sec === window.spinDuration ? 'active' : ''}" onclick="setSpinDuration(${sec})">${sec}초</div>
            `).join('');
        }

        function setSpinDuration(sec) {
            window.spinDuration = sec;
            persist();
            renderDurationButtons();
            showToast(`룰렛 회전 시간이 ${sec}초로 설정되었습니다.`);
        }

        function updateProbBadges() {
            const activeItems = getActiveItems();
            const totalWeight = activeItems.reduce((acc, it) => acc + it.weight, 0);
            window.items.forEach((item, i) => {
                const badge = document.getElementById(`prob-badge-${i}`);
                if (!badge) return;
                const isActive = activeItems.includes(item);
                const prob = isActive && totalWeight > 0 ? (item.weight / totalWeight * 100) : 0;
                const probText = prob >= 1 ? prob.toFixed(1) : prob.toFixed(2);
                badge.textContent = isActive ? `${probText}%` : '재고없음';
                badge.classList.toggle('inactive', !isActive);
            });
        }

        const trashIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';

        function renderAdminList() {
            renderDurationButtons();

            const activeItems = getActiveItems();
            const totalWeight = activeItems.reduce((acc, it) => acc + it.weight, 0);

            const list = document.getElementById('admin-item-list');
            list.innerHTML = window.items.map((item, i) => {
                const isActive = activeItems.includes(item);
                const prob = isActive && totalWeight > 0 ? (item.weight / totalWeight * 100) : 0;
                const probText = prob >= 1 ? prob.toFixed(1) : prob.toFixed(2);
                const probLabel = isActive ? `${probText}%` : '재고없음';
                return `
                <div class="admin-item">
                    <div class="admin-item-row">
                        <input type="text" value="${item.name}" oninput="window.items[${i}].name=this.value" class="admin-item-name-input" placeholder="경품명">
                        <div class="admin-item-field">
                            <span class="admin-item-field-label">재고</span>
                            <input type="number" value="${item.stock}" oninput="window.items[${i}].stock=parseInt(this.value)||0; updateProbBadges();" class="admin-item-field-input">
                        </div>
                        <div class="admin-item-field">
                            <span class="admin-item-field-label">확률가중치</span>
                            <input type="number" value="${item.weight}" oninput="window.items[${i}].weight=parseInt(this.value)||0; updateProbBadges();" class="admin-item-field-input">
                        </div>
                        <span id="prob-badge-${i}" class="prob-badge ${isActive ? '' : 'inactive'}">${probLabel}</span>
                        <button type="button" onclick="removeItem(${i})" class="admin-item-delete-btn" aria-label="삭제">${trashIconSvg}</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        async function spin() {
            if (isSpinning) return;
            const activeItems = getActiveItems();
            if (activeItems.length === 0) {
                showToast('준비된 경품이 모두 소진되었습니다.');
                return;
            }
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            const totalWeight = activeItems.reduce((acc, it) => acc + it.weight, 0);
            let rand = Math.random() * totalWeight;
            let winner = activeItems[0];
            let acc = 0;
            for (let it of activeItems) {
                acc += it.weight;
                if (rand < acc) { winner = it; break; }
            }

            const extraSpins = 12;
            const randomStopAngle = Math.floor(Math.random() * 360);
            currentRotation += (extraSpins * 360) + randomStopAngle;

            const durationSec = window.spinDuration || 0.5;
            const wheelEl = document.getElementById('wheel');
            wheelEl.style.transition = `transform ${durationSec}s cubic-bezier(0.15, 0, 0.05, 1)`;
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                document.getElementById('win-item-name').innerText = winner.name;
                document.getElementById('result-overlay').classList.add('active');
                fireConfetti();

                window.items = window.items.map(it => it.id === winner.id ? { ...it, stock: it.stock - 1 } : it);
                persist();
                renderAdminList();
            }, durationSec * 1000 + 100);
        }

        function openAdmin() { document.getElementById('admin-login-modal').classList.add('open'); }
        function checkAdminPass() {
            if (document.getElementById('admin-pass').value === '8887') {
                closeModal('admin-login-modal');
                document.getElementById('admin-pass').value = '';
                document.getElementById('admin-settings-modal').classList.add('open');
                renderAdminList();
            } else { showToast('PIN 코드가 틀립니다.'); }
        }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        function showToast(msg) {
            let el = document.getElementById('toast-msg');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast-msg';
                el.className = 'toast-msg';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(el._toastTimer);
            el._toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2200);
        }

        let confettiTimers = [];
        function fireConfetti() {
            confettiTimers.forEach(t => clearTimeout(t));
            confettiTimers = [];
            const colors = ['#DD3E78', '#FF9EC4', '#FFFFFF'];
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors, zIndex: 10500 });
            confettiTimers.push(setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors, zIndex: 10500 }), 300));
            confettiTimers.push(setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors, zIndex: 10500 }), 500));
        }

        function closeResult() {
            confettiTimers.forEach(t => clearTimeout(t));
            confettiTimers = [];
            document.getElementById('result-overlay').classList.remove('active');
            currentRotation %= 360;
            const wheelEl = document.getElementById('wheel');
            wheelEl.style.transition = 'none';
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;
            document.getElementById('spin-btn').disabled = false;
            isSpinning = false;
        }

        function addItem() {
            window.items.push({ id: Date.now(), name: "새 경품", stock: 10, weight: 10 });
            renderAdminList();
        }
        function removeItem(i) {
            if(confirm('삭제하시겠습니까?')) {
                window.items.splice(i, 1);
                renderAdminList();
            }
        }
        function saveData() {
            persist();
            showToast('저장되었습니다. (이 PC의 브라우저에 보관됩니다)');
            closeModal('admin-settings-modal');
        }

        window.onload = () => { renderAdminList(); };
    </script>
</body>
</html>
